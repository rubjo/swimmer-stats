name: Scrape

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: # manual trigger

# Concurrency belongs at the WORKFLOW level so the group scopes the whole run.
# Only ONE Scrape run executes at a time; a run scheduled while one is in
# progress is queued and starts after it finishes (cancel-in-progress: false).
# Putting this on the matrix `scrape` job instead made all 8 shards share one
# group, so each starting shard evicted the others ("higher priority waiting
# request for scrape-queue") — only one shard survived.
concurrency:
  group: scrape-queue
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # ┌───────────────────────────────────────────────────────────────[...]
  # │ THE ONLY SWITCH YOU NEED TO FLIP between seasons.                     │
  # │                                                                      │
  # │  "1" = backfill-only week (no meets): skip the licensed loop and fan  │
  # │        out across all shards to drain the non-licensed pool fast.     │
  # │  "0" = normal incremental scraping (meets happening): run the         │
  # │        licensed loop on shard 0 ONLY; shards 1–7 skip themselves.     │
  # │                                                                      │
  # │ Nothing else needs changing. index.js reads BACKFILL_ONLY and treats  │
  # │ SHARD_COUNT as 1 when it is "0", so the licensed loop is never run     │
  # │ 8× even though the matrix still lists 8 shards.                        │
  # └───────────────────────────────────────────────────────────────[...]
  BACKFILL_ONLY: "1"

  # Fan-out width used ONLY in backfill-only mode. index.js ignores this (treats
  # it as 1) whenever BACKFILL_ONLY != "1", so you never have to touch it when
  # flipping the switch above. Keep it equal to the matrix.shard list length.
  SHARD_COUNT: "8"

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Install Chrome for Puppeteer
      - name: Install Chrome
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
        run: |
          set -ex
          rm -rf /tmp/puppeteer-cache
          node -e "
            const {install, computeExecutablePath, resolveBuildId, detectBrowserPlatform} = require('@puppeteer/browsers');
            const {PUPPETEER_REVISIONS} = require('puppeteer-core/internal/revisions.js');
            const platform = detectBrowserPlatform();
            const buildId = PUPPETEER_REVISIONS.chrome;
            console.log('Platform:', platform, 'BuildId:', buildId);
            install({
              browser: 'chrome',
              buildId,
              platform,
              cacheDir: '/tmp/puppeteer-cache',
              downloadProgressCallback: (d,l) => console.log('Downloaded', d, '/', l),
            }).then(() => {
              const p = computeExecutablePath({browser:'chrome', buildId, cacheDir:'/tmp/puppeteer-cache', platform});
              console.log('Installed at:', p);
            }).catch(e => { console.error('Install failed:', e); process.exit(1); });
          "
          echo "Verifying:"
          find /tmp/puppeteer-cache -name chrome -type f

      # Chromium system dependencies for Puppeteer
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libxkbcommon0 \
            libxdamage1 libgbm1 libasound2t64

      # git identity is only needed because rebuildIndex may shell out to
      # `git rebase --abort` when it finds stale conflict markers; shards never
      # commit or push (NO_PUSH=1).
      - name: Configure git
        run: |
          git config user.name "medley-bot"
          git config user.email "bot@users.noreply.github.com"

      # Skip the actual scrape on shards 1–7 when NOT in backfill-only mode:
      # the licensed loop isn't sharded, so those shards would only redo shard
      # 0's work. In backfill-only mode every shard runs and splits the pool.
      # (env is usable in a step-level if; it is NOT usable in a job-level if.)
      - name: Run scraper (shard ${{ matrix.shard }})
        if: ${{ env.BACKFILL_ONLY == '1' || matrix.shard == 0 }}
        continue-on-error: true
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
          LOOKBACK_DAYS: "30"
          BACKFILL_ENABLED: "1"
          BACKFILL_NEW_PER_RUN: "10"
          # BACKFILL_ONLY inherits the top-level switch — do NOT hardcode it here.
          # Sharding: this shard scrapes candidate i where i % SHARD_COUNT == SHARD_INDEX.
          # index.js forces SHARD_COUNT to 1 when BACKFILL_ONLY != "1", so a
          # stray non-zero shard that still ran would not mis-slice the pool.
          SHARD_INDEX: ${{ matrix.shard }}
          # SHARD_COUNT inherits the top-level env value.
          # Shards write files but never push — the merge job does the single commit.
          NO_PUSH: "1"
        run: |
          # capture failures inside the step but don't abort the job (continue-on-error)
          set -e
          node index.js

      # Upload only THIS shard's outputs. Swimmer files are disjoint across
      # shards; checked-empty.json is this shard's partial ledger (unioned later).
      # Same guard as the scrape step: a skipped shard has nothing to upload.
      - name: Upload shard data
        if: ${{ env.BACKFILL_ONLY == '1' || matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            data/swimmers/**
            data/checked-empty.json
          if-no-files-found: ignore
          retention-days: 1

  # ── Fan-in: collect all shards, rebuild index once, single commit + deploy ──
  merge:
    needs: scrape
    # Run even if some shards failed — commit the work of the ones that finished.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The Pages deploy happens here, so the pages concurrency group belongs here.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "medley-bot"
          git config user.email "bot@users.noreply.github.com"

      # Each artifact lands in /tmp/shards/<artifact-name>/ (e.g. shard-0/).
      - name: Download all shard data
        uses: actions/download-artifact@v4
        with:
          path: /tmp/shards

      - name: Merge shard files into data/
        id: merge
        run: |
          set -ex
          shopt -s nullglob

          # collect shard directories
          shards=(/tmp/shards/shard-*)
          if [ ${#shards[@]} -eq 0 ] || [ "${shards[0]}" = "/tmp/shards/shard-*" ]; then
            echo "No shard artifacts found. Nothing to merge."
            echo "merged=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          merged_any=false
          # Swimmer files: disjoint per shard, so a recursive copy never
          # overwrites another shard's work. writeSwimmerFile's own guards
          # (id-suffixed paths, empty-over-nonempty refusal) already prevented
          # any within-shard clobber before upload.
          for d in "${shards[@]}"; do
            if [ -d "$d/swimmers" ]; then
              mkdir -p data/swimmers
              cp -R "$d/swimmers/." data/swimmers/
              merged_any=true
            fi
          done

          # checked-empty.json: union all shard ledgers with the committed one.
          checked=(/tmp/shards/shard-*/checked-empty.json)
          if [ ${#checked[@]} -gt 0 ] && [ "${checked[0]}" != "/tmp/shards/shard-*/checked-empty.json" ]; then
            node scripts/merge-checked-empty.js "${checked[@]}"
            merged_any=true
          fi

          if [ "$merged_any" = true ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail when no shard outputs were merged
        if: steps.merge.outputs.merged != 'true'
        run: |
          echo "No shard artifacts were produced by any shard — failing to alert."
          exit 1

      - name: Rebuild index once over the merged data
        if: steps.merge.outputs.merged == 'true'
        run: node scripts/rebuild-index.js

      - name: Commit merged data
        if: steps.merge.outputs.merged == 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sharded scrape $(date -u +%F) [skip ci]"
            git push origin HEAD:main || (
              git pull --rebase origin main &&
              git push origin HEAD:main
            ) || echo "Push skipped — continuing for deployment"
          fi

      - name: Upload Pages artifact
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: data

      - name: Deploy to Pages
        if: steps.merge.outputs.merged == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
