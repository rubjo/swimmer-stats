name: Scrape

on:
  schedule:
    - cron: "0 */2 * * *" # every two hours
  workflow_dispatch: # manual trigger

# Concurrency belongs at the WORKFLOW level so the group scopes the whole run.
# Only ONE Scrape run executes at a time; a run scheduled while one is in
# progress is queued and starts after it finishes (cancel-in-progress: false).
# Putting this on the matrix `scrape` job instead made all 8 shards share one
# group, so each starting shard evicted the others ("higher priority waiting
# request for scrape-queue") — only one shard survived.
concurrency:
  group: scrape-queue
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Fan-out width: the licensed roster is split across this many parallel shards
  # (shard i scrapes swimmer j where j % SHARD_COUNT == SHARD_INDEX). Keep this
  # equal to the matrix.shard list length below.
  SHARD_COUNT: "8"

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Install Chrome for Puppeteer
      - name: Install Chrome
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
        run: |
          set -ex
          rm -rf /tmp/puppeteer-cache
          node -e "
            const {install, computeExecutablePath, resolveBuildId, detectBrowserPlatform} = require('@puppeteer/browsers');
            const {PUPPETEER_REVISIONS} = require('puppeteer-core/internal/revisions.js');
            const platform = detectBrowserPlatform();
            const buildId = PUPPETEER_REVISIONS.chrome;
            console.log('Platform:', platform, 'BuildId:', buildId);
            install({
              browser: 'chrome',
              buildId,
              platform,
              cacheDir: '/tmp/puppeteer-cache',
              downloadProgressCallback: (d,l) => console.log('Downloaded', d, '/', l),
            }).then(() => {
              const p = computeExecutablePath({browser:'chrome', buildId, cacheDir:'/tmp/puppeteer-cache', platform});
              console.log('Installed at:', p);
            }).catch(e => { console.error('Install failed:', e); process.exit(1); });
          "
          echo "Verifying:"
          find /tmp/puppeteer-cache -name chrome -type f

      # Chromium system dependencies for Puppeteer
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libxkbcommon0 \
            libxdamage1 libgbm1 libasound2t64

      # git identity is only needed because rebuildIndex may shell out to
      # `git rebase --abort` when it finds stale conflict markers; shards never
      # commit or push (NO_PUSH=1).
      - name: Configure git
        run: |
          git config user.name "medley-bot"
          git config user.email "bot@users.noreply.github.com"
          # Register the driver referenced by `.gitattributes` (data/index.json
          # merge=ours). Without this the attribute is a no-op and every rebase
          # 3-way-merges the whole-file-rewritten index.json, conflicting and
          # dropping the push. `true` = keep ours, always succeed.
          git config merge.ours.driver true

      # Every shard runs and scrapes its disjoint slice of the licensed roster
      # (shard i owns swimmer j where j % SHARD_COUNT == SHARD_INDEX).
      - name: Run scraper (shard ${{ matrix.shard }})
        continue-on-error: true
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
          # Trailing window: check from today back this many days for new races.
          LOOKBACK_DAYS: "90"
          # Sharding: this shard scrapes swimmer j where j % SHARD_COUNT == SHARD_INDEX.
          SHARD_INDEX: ${{ matrix.shard }}
          # SHARD_COUNT inherits the top-level env value.
          # Shards write files but never push — the merge job does the single commit.
          NO_PUSH: "1"
        run: |
          # capture failures inside the step but don't abort the job (continue-on-error)
          set -e
          node index.js

      # Upload only THIS shard's outputs. Swimmer files are disjoint across
      # shards, so the merge job can copy them all together without clobbering.
      # processed-shard-<i>.json lists the swimmers this shard checked (for the
      # merge job's lastChecked update). Keeping both paths also roots the
      # artifact at data/ (least-common-ancestor), so the files land at
      # /tmp/shards/shard-<i>/swimmers/… exactly as the merge step expects.
      - name: Upload shard data
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            data/swimmers/**
            data/processed-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  # ── Fan-in: collect all shards, rebuild index once, single commit + deploy ──
  merge:
    needs: scrape
    # Run even if some shards failed — commit the work of the ones that finished.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The Pages deploy happens here, so the pages concurrency group belongs here.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "medley-bot"
          git config user.email "bot@users.noreply.github.com"
          # Register the merge=ours driver (see .gitattributes) so the commit
          # step's `git pull --rebase` doesn't conflict on index.json and drop
          # the push. This is the job that actually commits + pushes.
          git config merge.ours.driver true

      # Each artifact lands in /tmp/shards/<artifact-name>/ (e.g. shard-0/).
      - name: Download all shard data
        uses: actions/download-artifact@v4
        with:
          path: /tmp/shards

      - name: Merge shard files into data/
        id: merge
        run: |
          set -ex
          shopt -s nullglob

          # collect shard directories
          shards=(/tmp/shards/shard-*)
          if [ ${#shards[@]} -eq 0 ] || [ "${shards[0]}" = "/tmp/shards/shard-*" ]; then
            echo "No shard artifacts found. Nothing to merge."
            echo "merged=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          merged_any=false
          # Swimmer files: disjoint per shard, so a recursive copy never
          # overwrites another shard's work. writeSwimmerFile's own guards
          # (id-suffixed paths, empty-over-nonempty refusal) already prevented
          # any within-shard clobber before upload.
          for d in "${shards[@]}"; do
            if [ -d "$d/swimmers" ]; then
              mkdir -p data/swimmers
              cp -R "$d/swimmers/." data/swimmers/
              merged_any=true
            fi
          done

          if [ "$merged_any" = true ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail when no shard outputs were merged
        if: steps.merge.outputs.merged != 'true'
        run: |
          echo "No shard artifacts were produced by any shard — failing to alert."
          exit 1

      - name: Rebuild index once over the merged data
        if: steps.merge.outputs.merged == 'true'
        env:
          # Scan the downloaded shard artifacts for each shard's
          # processed-shard-<i>.json so lastChecked advances for every swimmer
          # checked this run (drives the least-recently-checked-first rotation).
          PROCESSED_SCAN_DIR: /tmp/shards
        run: node scripts/rebuild-index.js

      - name: Commit merged data
        if: steps.merge.outputs.merged == 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sharded scrape $(date -u +%F) [skip ci]"
            # Do NOT swallow a failed push. With the merge=ours driver registered
            # (Configure git step) the rebase no longer conflicts on index.json,
            # so a failure here is a real problem and should fail the run rather
            # than deploying an un-pushed tree with the commit silently dropped.
            git push origin HEAD:main || (
              git pull --rebase origin main &&
              git push origin HEAD:main
            )
          fi

      - name: Upload Pages artifact
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the REPO ROOT, not data/. The landing page (index.html) lives
          # at the root and redirects to data/index.json, and the app fetches
          # data/index.json. Uploading `data` hoisted its contents to the site
          # root, so index.json was served at /index.json (not /data/index.json)
          # and index.html never shipped — the "index.json not available" symptom.
          path: .

      - name: Deploy to Pages
        if: steps.merge.outputs.merged == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
