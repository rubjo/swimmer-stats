name: Scrape

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Install Chrome for Puppeteer
      - name: Install Chrome
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
        run: |
          set -ex
          rm -rf /tmp/puppeteer-cache
          node -e "
            const {install, computeExecutablePath, resolveBuildId, detectBrowserPlatform} = require('@puppeteer/browsers');
            const {PUPPETEER_REVISIONS} = require('puppeteer-core/internal/revisions.js');
            const platform = detectBrowserPlatform();
            const buildId = PUPPETEER_REVISIONS.chrome;
            console.log('Platform:', platform, 'BuildId:', buildId);
            install({
              browser: 'chrome',
              buildId,
              platform,
              cacheDir: '/tmp/puppeteer-cache',
              downloadProgressCallback: (d,l) => console.log('Downloaded', d, '/', l),
            }).then(() => {
              const p = computeExecutablePath({browser:'chrome', buildId, cacheDir:'/tmp/puppeteer-cache', platform});
              console.log('Installed at:', p);
            }).catch(e => { console.error('Install failed:', e); process.exit(1); });
          "
          echo "Verifying:"
          find /tmp/puppeteer-cache -name chrome -type f

      # Chromium system dependencies for Puppeteer
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libxkbcommon0 \
            libxdamage1 libgbm1 libasound2t64

      # Configure git for in-script checkpoints and the commit step below
      - name: Configure git
        run: |
          git config user.name "medley-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Run scraper
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
        run: node index.js

      # Commit any leftover data not yet pushed by in-script checkpoints
      - name: Commit data
        if: always()
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scrape $(date -u +%F) [skip ci]"
            git pull --rebase
            git push
          fi

      # Deploy the data directory to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
