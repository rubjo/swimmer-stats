name: Cancel in-progress Pages deployments on push

on:
  push:
    branches: [main]

permissions:
  deployments: write

jobs:
  cancel-in-progress-pages-deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress deployments
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const perPage = 100;
            console.log(`Looking up deployments for ${owner}/${repo}`);
            const deployments = await github.rest.repos.listDeployments({ owner, repo, per_page: perPage });
            let cancelled = 0;
            for (const d of deployments.data) {
              try {
                const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 5 });
                if (!statuses.data || statuses.data.length === 0) continue;
                const latest = statuses.data[0];
                if (latest.state === 'in_progress') {
                  console.log(`Cancelling deployment id=${d.id} sha=${d.sha} environment=${d.environment}`);
                  await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: d.id, state: 'inactive', description: 'Cancelled by automated workflow to allow new Pages deployment' });
                  cancelled++;
                }
              } catch (err) {
                console.log(`Skipping deployment ${d.id} due to error: ${err}`);
              }
            }
            console.log(`Done — cancelled ${cancelled} in-progress deployment(s)`);
